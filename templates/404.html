
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>404 - Page Not Found | StyloTech</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            height:100vh;
            overflow:hidden;
            background:linear-gradient(135deg,#012e63,#001933,#000814);
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            color:#fff;
        }

        /* Animated Glow Circles */

        .circle{
            position:absolute;
            border-radius:50%;
            filter:blur(90px);
            opacity:.35;
            animation:float 8s ease-in-out infinite;
        }

        .circle1{
            width:280px;
            height:280px;
            background:#ed2424;
            top:-80px;
            left:-80px;
        }

        .circle2{
            width:320px;
            height:320px;
            background:#012e63;
            bottom:-120px;
            right:-100px;
            animation-delay:2s;
        }

        .circle3{
            width:180px;
            height:180px;
            background:#ed2424;
            top:40%;
            left:60%;
            animation-delay:4s;
        }

        @keyframes float{
            0%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(-20px);
            }
            100%{
                transform:translateY(0px);
            }
        }

        /* Main Box */

        .error-container{
            width:90%;
            max-width:700px;
            text-align:center;
            padding:60px 40px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.12);
            backdrop-filter:blur(14px);
            border-radius:30px;
            box-shadow:0 20px 50px rgba(0,0,0,.35);
            z-index:10;
        }

        .logo{
            font-size:22px;
            font-weight:700;
            letter-spacing:1px;
            margin-bottom:20px;
            color:#ed2424;
        }

        .error-code{
            font-size:150px;
            font-weight:700;
            line-height:1;
            background:linear-gradient(90deg,#ed2424,#ff6b6b);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            margin-bottom:15px;
        }

        .icon-box{
            width:90px;
            height:90px;
            margin:0 auto 25px;
            border-radius:50%;
            background:rgba(255,255,255,0.08);
            display:flex;
            align-items:center;
            justify-content:center;
            border:1px solid rgba(255,255,255,.12);
        }

        .icon-box i{
            font-size:40px;
            color:#ed2424;
        }

        h1{
            font-size:34px;
            margin-bottom:15px;
            font-weight:600;
        }

        p{
            color:#cbd5e1;
            line-height:1.8;
            font-size:16px;
            max-width:550px;
            margin:0 auto 35px;
        }

        .btn-group{
            display:flex;
            justify-content:center;
            gap:18px;
            flex-wrap:wrap;
        }

        .home-btn{
            display:inline-flex;
            align-items:center;
            gap:10px;
            padding:15px 30px;
            border-radius:14px;
            text-decoration:none;
            font-weight:500;
            transition:.3s ease;
            background:linear-gradient(90deg,#ed2424,#b91c1c);
            color:#fff;
            box-shadow:0 10px 25px rgba(237,36,36,.35);
        }

        .home-btn:hover{
            transform:translateY(-4px);
            box-shadow:0 15px 35px rgba(237,36,36,.45);
        }

        .contact-btn{
            display:inline-flex;
            align-items:center;
            gap:10px;
            padding:15px 30px;
            border-radius:14px;
            text-decoration:none;
            font-weight:500;
            transition:.3s ease;
            border:1px solid rgba(255,255,255,.15);
            background:rgba(255,255,255,.06);
            color:#fff;
        }

        .contact-btn:hover{
            background:rgba(255,255,255,.12);
            transform:translateY(-4px);
        }

        /* Responsive */

        @media(max-width:768px){

            .error-container{
                padding:45px 25px;
            }

            .error-code{
                font-size:110px;
            }

            h1{
                font-size:26px;
            }

            p{
                font-size:15px;
            }

            .btn-group{
                flex-direction:column;
            }

            .home-btn,
            .contact-btn{
                width:100%;
                justify-content:center;
            }

        }

    </style>
</head>

<body>

    <!-- Background Glow -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <!-- Main Content -->
    <div class="error-container">

        <div class="logo">
            STYLOTECH
        </div>

        <div class="error-code">
            404
        </div>

        <div class="icon-box">
            <i class="ri-error-warning-line"></i>
        </div>

        <h1>Oops! Page Not Found</h1>

        <p>
            The page you are trying to access might have been removed,
            renamed, or is temporarily unavailable.
            Let’s get you back to the StyloTech experience.
        </p>

        <div class="btn-group">

            <a href="{% url 'home' %}" class="home-btn">
                <i class="ri-home-5-line"></i>
                Back To Home
            </a>

            <a href="{% url 'contact' %}" class="contact-btn">
                <i class="ri-customer-service-2-line"></i>
                Contact Us
            </a>

        </div>

    </div>

</body>
</html>
