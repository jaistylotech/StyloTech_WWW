version: '3.9'

services:
  web:
    build: .
    container_name: stylotech_web
    ports:
      - "8011:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-here-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,stylotech.in,www.stylotech.in
      - DJANGO_SETTINGS_MODULE=stylotech_site.settings
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - stylotech_site.wsgi:application
    restart: unless-stopped
