name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/stylotech-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/vedx/code/StyloTech_WWW-main
            
            # Pull latest changes from main branch
            echo "📥 Pulling latest code from main branch..."
            git pull origin main
            
            # Pull latest Docker images
            echo "🐳 Pulling latest Docker images..."
            docker compose pull
            
            # Stop and remove old containers
            echo "🛑 Stopping old containers..."
            docker compose down
            
            # Build and start new containers
            echo "🚀 Starting new containers with docker compose..."
            docker compose up -d --build
            
            # Wait for services to be ready
            sleep 5
            
            # Check if containers are running
            echo "✅ Checking container status..."
            docker compose ps
            
            # View logs
            echo "📋 Recent logs..."
            docker compose logs --tail 20

      - name: Configure Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "⚙️ Configuring Nginx..."
            
            # Check if nginx config exists
            if [ -f /etc/nginx/sites-available/stylotech ]; then
              echo "📝 Nginx configuration found"
            else
              echo "⚠️ Creating Nginx configuration..."
              sudo tee /etc/nginx/sites-available/stylotech > /dev/null <<EOF
            server {
                listen 80;
                server_name _;
                
                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_redirect off;
                    
                    # For WebSocket support (if needed)
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection "upgrade";
                }
                
                location /static/ {
                    alias /home/vedx/code/StyloTech_WWW-main/static/;
                    expires 30d;
                    add_header Cache-Control "public, immutable";
                }
                
                location /media/ {
                    alias /home/vedx/code/StyloTech_WWW-main/media/;
                    expires 7d;
                }
            }
            EOF
            fi
            
            # Enable site if not already enabled
            if [ ! -L /etc/nginx/sites-enabled/stylotech ]; then
              sudo ln -s /etc/nginx/sites-available/stylotech /etc/nginx/sites-enabled/
            fi
            
            # Test nginx configuration
            echo "🧪 Testing Nginx configuration..."
            sudo nginx -t
            
            # Reload nginx
            echo "🔄 Reloading Nginx..."
            sudo systemctl reload nginx
            
            echo "✅ Nginx configuration complete"

      - name: Health Check
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🏥 Running health checks..."
            
            # Check if application is responding
            max_attempts=10
            attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts..."
              if curl -f http://127.0.0.1:8000/ > /dev/null 2>&1; then
                echo "✅ Application is healthy!"
                break
              fi
              echo "⏳ Waiting for application to be ready..."
              sleep 5
              attempt=$((attempt + 1))
            done
            
            if [ $attempt -gt $max_attempts ]; then
              echo "❌ Health check failed after $max_attempts attempts"
              exit 1
            fi

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🎉 StyloTech application deployed to main branch"
          echo "Server: ${{ secrets.SERVER_HOST }}"
          echo "Timestamp: $(date)"

      - name: Notify Failure
        if: failure()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "❌ Deployment failed!"
            echo "📋 Docker logs:"
            docker compose logs --tail 50
